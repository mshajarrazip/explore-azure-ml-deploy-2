# Training environment: used by the Azure ML job and by docker compose / local debugging.
name: credit-default-train
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - mlflow==2.22.5
      - azureml-mlflow==1.62.0.post6
      - scikit-learn==1.6.1
      - pandas==2.2.3
      - sqlalchemy<2.1  # mlflow 2.x SQL store (local runs) breaks on SQLAlchemy 2.1
      - starlette<1  # mlflow 2.x scoring server (`mlflow models serve`) uses app.route, removed in Starlette 1.0
